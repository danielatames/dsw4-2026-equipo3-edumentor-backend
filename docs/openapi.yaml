openapi: 3.0.3
info:
  title: EduMentor Hub API
  version: 1.0.0
  description: |
    API REST de la plataforma de tutorías académicas entre pares.
    Todas las respuestas de error siguen el estándar RFC 7807 (Problem Details).

    **Estados de la sesión.** El ciclo de vida definido en el enunciado se implementa
    con nombres en español. La equivalencia es:

    | Enunciado | API |
    |---|---|
    | REQUESTED | SOLICITADA |
    | CONFIRMED | ACEPTADA |
    | REJECTED | RECHAZADA |
    | CANCELLED | CANCELADA |
    | IN_SESSION | EN_CURSO |
    | COMPLETED | CONCLUIDA |
    | REVIEWED | EVALUADA |
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Auth
    description: Registro e inicio de sesión
  - name: Usuarios
    description: Datos del usuario autenticado
  - name: Sesiones
    description: Solicitud, aceptación y seguimiento de sesiones de tutoría
  - name: Recursos
    description: Enlaces y materiales didácticos asociados a una sesión
  - name: Evaluaciones
    description: Calificación del estudiante al tutor y promedio acumulado
  - name: Materias
    description: Catálogo de asignaturas (lectura para todos, administración del COORDINADOR)
  - name: Disponibilidad
    description: Bloques de horario semanal en que cada tutor ofrece tutorías
security:
  - bearerAuth: []

paths:
  #Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Valida las credenciales y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario
      description: >
        Crea una cuenta y devuelve un token JWT. El rol COORDINADOR no
        puede autorregistrarse (respuesta 403).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  #Sesiones
  /sesiones:
    get:
      tags: [Sesiones]
      summary: Listar sesiones según el rol
      description: >
        ESTUDIANTE ve las sesiones que solicitó, TUTOR las que le pidieron a él
        y COORDINADOR ve todas. Se puede filtrar por estado.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoSesion'
      responses:
        '200':
          description: Lista de sesiones ordenada de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Sesiones]
      summary: Solicitar una sesión (solo ESTUDIANTE)
      description: >
        Crea la sesión en estado SOLICITADA. Valida que la fecha sea futura,
        que la sesión quepa en un bloque de disponibilidad del tutor y que no se
        traslape con otra sesión activa del tutor ni del estudiante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionRequest'
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La sesión se traslapa con otra del tutor o del estudiante
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Fecha en el pasado o el tutor no tiene disponibilidad en ese horario
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    get:
      tags: [Sesiones]
      summary: Obtener una sesión
      description: Solo la ven el estudiante y el tutor de la sesión, o el COORDINADOR.
      responses:
        '200':
          description: Sesión encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/aceptar:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    patch:
      tags: [Sesiones]
      summary: Aceptar una solicitud (solo el TUTOR de la sesión)
      description: Pasa la sesión de SOLICITADA a ACEPTADA.
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/rechazar:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    patch:
      tags: [Sesiones]
      summary: Rechazar una solicitud (solo el TUTOR de la sesión)
      description: Pasa la sesión de SOLICITADA a RECHAZADA.
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    patch:
      tags: [Sesiones]
      summary: Cancelar una sesión (estudiante o tutor de la sesión)
      description: >
        Pasa la sesión de SOLICITADA o ACEPTADA a CANCELADA.
        Solo se permite si faltan 2 horas o más para que empiece.
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
        '422':
          description: Faltan menos de 2 horas para que empiece la sesión
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/iniciar:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    patch:
      tags: [Sesiones]
      summary: Iniciar una sesión (solo el TUTOR de la sesión)
      description: Pasa la sesión de ACEPTADA a EN_CURSO.
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/concluir:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    patch:
      tags: [Sesiones]
      summary: Concluir una sesión (solo el TUTOR de la sesión)
      description: Pasa la sesión de EN_CURSO a CONCLUIDA.
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
        '500':
          $ref: '#/components/responses/InternalError'

  #Recursos
  /sesiones/{id}/recursos:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    get:
      tags: [Recursos]
      summary: Listar los recursos de una sesión
      description: >
        Disponible para el estudiante y el tutor de la sesión, y para el COORDINADOR.
      responses:
        '200':
          description: Recursos de la sesión en orden de creación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecursoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Recursos]
      summary: Agregar un recurso (solo el TUTOR de la sesión)
      description: >
        Solo se admiten recursos en sesiones ACEPTADA, EN_CURSO, CONCLUIDA o EVALUADA.
        La URL debe empezar por http:// o https://.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones/{id}/recursos/{recursoId}:
    parameters:
      - $ref: '#/components/parameters/SesionId'
      - name: recursoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Recursos]
      summary: Eliminar un recurso (solo el TUTOR de la sesión)
      responses:
        '204':
          description: Recurso eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # Evaluaciones
  /sesiones/{id}/evaluacion:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    post:
      tags: [Evaluaciones]
      summary: Evaluar una sesión concluida (solo el ESTUDIANTE de la sesión)
      description: >
        Registra la calificación de 1 a 5 estrellas, pasa la sesión de CONCLUIDA a
        EVALUADA y recalcula el promedio acumulado del tutor. Cada sesión admite una
        sola evaluación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionRequest'
      responses:
        '201':
          description: Evaluación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Evaluaciones]
      summary: Consultar la evaluación de una sesión
      description: >
        Disponible para el estudiante y el tutor de la sesión, y para el COORDINADOR.
        Responde 404 si la sesión todavía no fue evaluada.
      responses:
        '200':
          description: Evaluación de la sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tutores/{tutorId}/calificacion:
    get:
      tags: [Evaluaciones]
      summary: Promedio acumulado de calificación de un tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Promedio y cantidad de evaluaciones del tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalificacionTutorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  #Materias
  /materias:
    get:
      tags: [Materias]
      summary: Listar el catálogo de materias
      description: >
        Disponible para cualquier usuario autenticado. Los filtros son opcionales
        y el resultado se ordena por nombre de la materia.
      parameters:
        - name: carrera
          in: query
          required: false
          description: Filtra por carrera exacta (sin distinguir mayúsculas)
          schema:
            type: string
            example: Informática Empresarial
        - name: nombre
          in: query
          required: false
          description: Busca materias cuyo nombre contenga este texto
          schema:
            type: string
            example: prog
        - name: pagina
          in: query
          required: false
          description: Número de página, empieza en 0
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          description: Elementos por página (máximo 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Página de materias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMateriaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Materias]
      summary: Crear una materia
      description: >
        Solo COORDINADOR. El código se guarda sin espacios y en mayúsculas
        (" if0009 " queda como "IF0009") y no se puede repetir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriaRequest'
      responses:
        '201':
          description: Materia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe una materia con ese código
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /materias/{id}:
    parameters:
      - $ref: '#/components/parameters/MateriaId'
    get:
      tags: [Materias]
      summary: Consultar una materia
      responses:
        '200':
          description: Datos de la materia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Materias]
      summary: Actualizar una materia
      description: Solo COORDINADOR. El código no puede coincidir con el de otra materia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriaRequest'
      responses:
        '200':
          description: Materia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe otra materia con ese código
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Materias]
      summary: Eliminar una materia
      description: Solo COORDINADOR.
      responses:
        '204':
          description: Materia eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La materia tiene sesiones de tutoría asociadas y no se puede eliminar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  #Disponibilidad del tutor
  /disponibilidades:
    get:
      tags: [Disponibilidad]
      summary: Listar los bloques activos de todos los tutores
      description: >
        Disponible para cualquier usuario autenticado. Se ordena de lunes a domingo
        y por hora de inicio. El tutor se carga con @EntityGraph (sin consultas N+1).
      responses:
        '200':
          description: Bloques activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisponibilidadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Disponibilidad]
      summary: Crear un bloque en el horario del tutor autenticado
      description: >
        Solo TUTOR. El bloque queda activo. Se rechaza si la hora de fin no es
        posterior a la de inicio (422) o si se solapa con otro bloque activo del
        mismo tutor ese día (409). Los bloques contiguos (08:00-10:00 y 10:00-12:00)
        sí se permiten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadRequest'
      responses:
        '201':
          description: Bloque creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El bloque se solapa con otro bloque activo del tutor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: La hora de fin no es posterior a la hora de inicio
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /disponibilidades/mias:
    get:
      tags: [Disponibilidad]
      summary: Listar todos los bloques del tutor autenticado
      description: Solo TUTOR. Incluye los bloques desactivados.
      responses:
        '200':
          description: Bloques del tutor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisponibilidadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /disponibilidades/tutor/{tutorId}:
    get:
      tags: [Disponibilidad]
      summary: Listar los bloques activos de un tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Bloques activos del tutor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisponibilidadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe un usuario con rol TUTOR con ese id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /disponibilidades/{id}:
    put:
      tags: [Disponibilidad]
      summary: Editar un bloque propio
      description: >
        Solo el TUTOR dueño del bloque. Si el bloque está activo se vuelve a
        validar que no se solape con los demás.
      parameters:
        - $ref: '#/components/parameters/DisponibilidadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadRequest'
      responses:
        '200':
          description: Bloque actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario no es TUTOR o el bloque pertenece a otro tutor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El bloque se solapa con otro bloque activo del tutor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: La hora de fin no es posterior a la hora de inicio
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /disponibilidades/{id}/estado:
    patch:
      tags: [Disponibilidad]
      summary: Activar o desactivar un bloque propio
      description: >
        Solo el TUTOR dueño del bloque. Al reactivarlo se valida que no choque
        con otro bloque activo (409). Un bloque inactivo no se ofrece para reservas.
      parameters:
        - $ref: '#/components/parameters/DisponibilidadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDisponibilidadRequest'
      responses:
        '200':
          description: Bloque con su nuevo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario no es TUTOR o el bloque pertenece a otro tutor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Al reactivarlo, el bloque se solapa con otro bloque activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enviar el token en el encabezado `Authorization Bearer <token>`.

  parameters:
    SesionId:
      name: id
      in: path
      required: true
      description: Identificador de la sesión de tutoría
      schema:
        type: integer
        format: int64

    MateriaId:
      name: id
      in: path
      required: true
      description: Identificador de la materia
      schema:
        type: integer
        format: int64
    DisponibilidadId:
      name: id
      in: path
      required: true
      description: Identificador del bloque de disponibilidad
      schema:
        type: integer
        format: int64

  schemas:
    #Auth y usuarios
    Rol:
      type: string
      enum: [ESTUDIANTE, TUTOR, COORDINADOR]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: tutor@ucr.ac.cr
        password:
          type: string
          example: Tutor123*

    RegisterRequest:
      type: object
      required: [carne, email, password, nombre, apellido, rol]
      properties:
        carne:
          type: string
          maxLength: 20
          example: C12345
        email:
          type: string
          format: email
          example: nuevo@ucr.ac.cr
        password:
          type: string
          minLength: 8
          maxLength: 72
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        carne:
          type: string
        email:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT firmado
        tipo:
          type: string
          example: Bearer
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'

    #Sesiones
    EstadoSesion:
      type: string
      description: >
        Equivalencias con el enunciado: SOLICITADA=REQUESTED, ACEPTADA=CONFIRMED,
        RECHAZADA=REJECTED, CANCELADA=CANCELLED, EN_CURSO=IN_SESSION,
        CONCLUIDA=COMPLETED, EVALUADA=REVIEWED.
      enum: [SOLICITADA, ACEPTADA, RECHAZADA, CANCELADA, EN_CURSO, CONCLUIDA, EVALUADA]

    SesionRequest:
      type: object
      required: [tutorId, materiaId, fechaHora, duracionMinutos]
      properties:
        tutorId:
          type: integer
          format: int64
          example: 2
        materiaId:
          type: integer
          format: int64
          example: 1
        fechaHora:
          type: string
          format: date-time
          description: Inicio de la sesión, sin zona horaria (hora de Costa Rica)
          example: '2026-12-01T08:00:00'
        duracionMinutos:
          type: integer
          minimum: 30
          maximum: 180
          example: 60
        tema:
          type: string
          maxLength: 300
          example: Repaso de JOINs

    SesionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        estudianteId:
          type: integer
          format: int64
        estudianteNombre:
          type: string
        tutorId:
          type: integer
          format: int64
        tutorNombre:
          type: string
        materiaId:
          type: integer
          format: int64
        materiaNombre:
          type: string
        fechaHora:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        duracionMinutos:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoSesion'
        tema:
          type: string
          nullable: true

    #Recursos
    TipoArchivo:
      type: string
      enum: [ENLACE, PDF, VIDEO, DOCUMENTO, PRESENTACION, OTRO]

    RecursoRequest:
      type: object
      required: [titulo, urlRecurso, tipoArchivo]
      properties:
        titulo:
          type: string
          maxLength: 150
          example: Guía de JOINs
        urlRecurso:
          type: string
          maxLength: 500
          pattern: '^https?://\S+$'
          example: https://ejemplo.com/guia-joins.pdf
        tipoArchivo:
          $ref: '#/components/schemas/TipoArchivo'

    RecursoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sesionId:
          type: integer
          format: int64
        titulo:
          type: string
        urlRecurso:
          type: string
        tipoArchivo:
          $ref: '#/components/schemas/TipoArchivo'

    # Evaluaciones
    EvaluacionRequest:
      type: object
      required: [calificacionEstrellas]
      properties:
        calificacionEstrellas:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          maxLength: 500
          example: Explicó muy claro los temas.

    EvaluacionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sesionId:
          type: integer
          format: int64
        calificacionEstrellas:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          nullable: true
        fechaEvaluacion:
          type: string
          format: date-time

    CalificacionTutorResponse:
      type: object
      properties:
        tutorId:
          type: integer
          format: int64
        tutorNombre:
          type: string
        promedio:
          type: number
          format: double
          example: 4.5
        totalEvaluaciones:
          type: integer
          example: 8

    #Materias
    MateriaRequest:
      type: object
      required: [codigoMateria, nombreMateria, carrera, creditos]
      properties:
        codigoMateria:
          type: string
          maxLength: 20
          example: IF0009
        nombreMateria:
          type: string
          maxLength: 120
          example: Desarrollo de Software IV
        carrera:
          type: string
          maxLength: 120
          example: Informática Empresarial
        creditos:
          type: integer
          minimum: 1
          maximum: 12
          example: 4

    MateriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        codigoMateria:
          type: string
          example: IF0009
        nombreMateria:
          type: string
          example: Desarrollo de Software IV
        carrera:
          type: string
          example: Informática Empresarial
        creditos:
          type: integer
          example: 4

    PaginaMateriaResponse:
      type: object
      description: Página de resultados (PaginaResponse genérico del backend)
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/MateriaResponse'
        pagina:
          type: integer
          description: Número de página actual, empieza en 0
          example: 0
        tamano:
          type: integer
          example: 10
        totalElementos:
          type: integer
          format: int64
          example: 11
        totalPaginas:
          type: integer
          example: 2

    #Disponibilidad
    DiaSemana:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    DisponibilidadRequest:
      type: object
      required: [diaSemana, horaInicio, horaFin]
      properties:
        diaSemana:
          $ref: '#/components/schemas/DiaSemana'
        horaInicio:
          type: string
          description: Hora en formato HH:mm
          example: '08:00'
        horaFin:
          type: string
          description: Hora en formato HH:mm, posterior a horaInicio
          example: '10:00'

    EstadoDisponibilidadRequest:
      type: object
      required: [activo]
      properties:
        activo:
          type: boolean
          example: false

    DisponibilidadResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        tutorId:
          type: integer
          format: int64
          example: 2
        tutorNombre:
          type: string
          example: Luis Tutor
        diaSemana:
          $ref: '#/components/schemas/DiaSemana'
        horaInicio:
          type: string
          example: '08:00:00'
        horaFin:
          type: string
          example: '10:00:00'
        estaActivo:
          type: boolean
          example: true

    #Errores 
    ProblemDetail:
      type: object
      description: Error según RFC 7807 (Problem Details)
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: No autenticado
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: Se requiere un token JWT válido
        instance:
          type: string
          example: /usuarios/me
        errores:
          type: object
          description: Mensajes de validación por campo (solo en respuestas 400)
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Solicitud inválida (validación de campos)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Falta el token JWT, no es válido o las credenciales son inválidas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: El rol o el usuario no tiene permiso para esta operación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: >
        Conflicto con el estado actual (por ejemplo, email o carné duplicado, o un
        estado de la sesión que no permite la operación)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TransicionInvalida:
      description: El estado actual de la sesión no permite esta acción
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Error interno del servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SesionActualizada:
      description: Sesión con su nuevo estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SesionResponse'